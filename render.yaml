# JARVIS Backend — Render deployment config
# Render uses this file to configure the web service.
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: jarvis-backend
    runtime: node
    buildCommand: npm install
    startCommand: node --import tsx server.ts
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false   # Set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel URL e.g. https://jarvis-delta-plum.vercel.app
